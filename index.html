<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earthen Spaces Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --g:#17372f;
  --g2:#2d604f;
  --g3:#3f8067;
  --p:#f5f3ec;
  --w:#fff;
  --l:#e3e0d7;
  --m:#68746d;
  --r:#b9574c;
  --y:#906924;
  --b:#4e7087;
  --sh:0 6px 22px rgba(23,55,47,.07)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--p);
  color:var(--g);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif
}

button,select{
  font:inherit;
  cursor:pointer
}

.app{
  min-height:100vh;
  display:flex
}

.side{
  position:fixed;
  inset:0 auto 0 0;
  width:250px;
  background:var(--g);
  color:#fff;
  padding:22px 15px;
  overflow:auto
}

.brand{
  padding:5px 12px 23px;
  border-bottom:1px solid #ffffff1f;
  margin-bottom:15px
}

.brand h1{
  margin:0;
  font:500 27px/.94 Georgia,serif
}

.brand small{
  display:block;
  margin-top:10px;
  font-size:9px;
  letter-spacing:.14em;
  opacity:.65
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#dce9e3;
  text-align:left;
  padding:11px 13px;
  border-radius:8px;
  margin:2px 0
}

.nav button:hover,
.nav button.active{
  background:#2b604f;
  color:#fff
}

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  padding:27px 31px 55px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:20px
}

.title{
  margin:0 0 5px;
  font:500 34px Georgia,serif
}

.sub{
  color:var(--m)
}

.actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap
}

.btn,
.select{
  background:#fff;
  border:1px solid var(--l);
  color:var(--g);
  border-radius:7px;
  padding:9px 12px
}

.btn.primary{
  background:var(--g);
  color:#fff;
  border-color:var(--g)
}

.live{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--m);
  font-size:12px
}

.live i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--g3)
}

.grid{
  display:grid;
  gap:11px
}

.g6{grid-template-columns:repeat(6,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.25fr 1fr}

.card,
.kpi,
.project{
  background:#fff;
  border:1px solid var(--l);
  border-radius:10px;
  padding:16px;
  box-shadow:var(--sh)
}

.kpi label{
  display:block;
  font-size:10px;
  color:var(--m);
  text-transform:uppercase;
  letter-spacing:.06em
}

.kpi b{
  display:block;
  margin-top:8px;
  font:24px Georgia,serif
}

.kpi small{
  display:block;
  margin-top:5px;
  color:var(--m);
  font-size:11px
}

.sec{
  margin-top:19px
}

.sec h2{
  margin:0;
  font:19px Georgia,serif
}

.sec-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:11px
}

.project-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px
}

.project{
  cursor:pointer
}

.project:hover{
  transform:translateY(-1px)
}

.eyebrow{
  font-size:11px;
  color:var(--m)
}

.pname{
  margin:6px 0 3px;
  font:600 21px Georgia,serif
}

.prog{
  height:7px;
  background:#ecebe5;
  border-radius:20px;
  overflow:hidden;
  margin:14px 0
}

.prog span{
  display:block;
  height:100%;
  background:var(--g3)
}

.pstats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.pstats small{
  font-size:10px;
  color:var(--m)
}

.pstats strong{
  display:block;
  margin-top:3px
}

.filter{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px
}

.filter label{
  font-size:10px;
  color:var(--m);
  text-transform:uppercase;
  letter-spacing:.07em
}

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:12px 0 14px
}

.tab{
  border:1px solid var(--l);
  background:#fff;
  color:var(--m);
  padding:9px 12px;
  border-radius:7px;
  white-space:nowrap
}

.tab.active{
  background:var(--g);
  color:#fff;
  border-color:var(--g)
}

.chart{
  position:relative;
  height:290px
}

.chart.tall{
  height:340px
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #eeeae1;
  font-size:12px
}

.row:last-child{
  border:0
}

.table-wrap{
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

th,
td{
  text-align:left;
  padding:9px 7px;
  border-bottom:1px solid #eeeae1;
  white-space:nowrap
}

th{
  font-size:10px;
  color:var(--m);
  text-transform:uppercase;
  letter-spacing:.05em
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:10px;
  white-space:nowrap
}

.good{
  background:#e8f2ec;
  color:#2e705a
}

.warn{
  background:#faf0dd;
  color:#906924
}

.bad{
  background:#fae8e5;
  color:#a34b43
}

.info{
  background:#eaf0f4;
  color:#4e7087
}

.empty,
.loading{
  text-align:center;
  padding:30px;
  color:var(--m)
}

.error{
  background:#faebe8;
  border:1px solid #e5c4be;
  border-radius:9px;
  padding:14px;
  color:#9b463d
}

@media(max-width:1200px){
  .g6{grid-template-columns:repeat(3,1fr)}
  .g5{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .project-grid{grid-template-columns:1fr}
}

@media(max-width:760px){

  .side{
    position:static;
    width:100%;
    height:auto
  }

  .app{
    display:block
  }

  .main{
    margin:0;
    width:100%;
    padding:20px 14px
  }

  .nav{
    display:flex;
    overflow:auto
  }

  .nav button{
    min-width:max-content
  }

  .top{
    flex-direction:column;
    align-items:flex-start
  }

  .g6,
  .g5,
  .g4{
    grid-template-columns:repeat(2,1fr)
  }

}
</style>
</head>

<body>

<div class="app">

  <aside class="side">

    <div class="brand">
      <h1>EARTHEN<br>SPACES</h1>
      <small>BUILDING BETTER TOMORROWS</small>
    </div>

    <nav class="nav">
      <button data-page="home" class="active">⌂ &nbsp; Home</button>
      <button data-page="projects">▦ &nbsp; Projects</button>
      <button data-page="approvals">✓ &nbsp; Approvals</button>
      <button data-page="finance">₹ &nbsp; Finance</button>
      <button data-page="marketing">◈ &nbsp; Marketing</button>
      <button data-page="presales">☎ &nbsp; Pre-Sales</button>
      <button data-page="sales">▤ &nbsp; Sales</button>
      <button data-page="cp">♧ &nbsp; Channel Partners</button>
      <button data-page="crm">◎ &nbsp; CRM & Collections</button>
    </nav>

  </aside>

  <main class="main">

    <div id="root">

      <div class="loading">
        Loading dashboard…
      </div>

    </div>

  </main>

</div>

<script>

/* =========================================================
   API
   ========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbziG51HnCv6QSyq7EGmLQfOc4_zBLPMEAO10x0OwLnNtLroqbALgJDhvsCo2dpSda1pyw/exec";


/* =========================================================
   STATE
   ========================================================= */

const state = {

  dashboard:null,

  projects:null,

  project:null,

  mgmt:{}

};

let chart = null;


/*
   BUGFIX: every non-Home page below writes to `root.innerHTML`
   but `root` was never declared, which throws
   "ReferenceError: root is not defined" and silently breaks
   every page except Home. Declaring it once here, globally,
   fixes all of those call sites without touching each one.
*/
const root =
  document.getElementById(
    "root"
  );


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


function n(value){

  value = Number(value);

  return Number.isFinite(value)
    ? value
    : 0;

}


function money(value){

  value = n(value);

  const abs =
    Math.abs(value);

  if(abs >= 10000000){

    return "₹" +
      (value / 10000000)
        .toFixed(2) +
      " Cr";

  }

  if(abs >= 100000){

    return "₹" +
      (value / 100000)
        .toFixed(1) +
      " L";

  }

  return "₹" +
    Math.round(value)
      .toLocaleString("en-IN");

}


function badge(status){

  status =
    String(status ?? "");

  const s =
    status.toLowerCase();

  let cls =
    "info";

  if(
    s.includes("pending") ||
    s.includes("planned") ||
    s.includes("partial")
  ){

    cls =
      "warn";

  }

  if(
    s.includes("done") ||
    s.includes("completed") ||
    s.includes("paid") ||
    s.includes("active") ||
    s.includes("ongoing") ||
    s.includes("achieved") ||
    s.includes("booked")
  ){

    cls =
      "good";

  }

  if(
    s.includes("cancel") ||
    s.includes("delay") ||
    s.includes("blocked")
  ){

    cls =
      "bad";

  }

  return `

    <span class="badge ${cls}">

      ${esc(
        status || "—"
      )}

    </span>

  `;

}


function htmlTable(
  headers,
  rows
){

  if(
    !rows ||
    !rows.length
  ){

    return `

      <div class="empty">
        No records found.
      </div>

    `;

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            ${
              headers
                .map(
                  h =>
                    `<th>${esc(h)}</th>`
                )
                .join("")
            }

          </tr>

        </thead>

        <tbody>

          ${
            rows
              .map(
                row => `

                  <tr>

                    ${
                      row
                        .map(
                          value =>
                            `<td>${value}</td>`
                        )
                        .join("")
                    }

                  </tr>

                `
              )
              .join("")
          }

        </tbody>

      </table>

    </div>

  `;

}


function top(
  title,
  subtitle,
  extra=""
){

  return `

    <div class="top">

      <div>

        <h1 class="title">
          ${esc(title)}
        </h1>

        <div class="sub">
          ${esc(subtitle)}
        </div>

      </div>

      <div class="actions">

        ${extra}

        <span class="live">

          <i></i>
          Live

        </span>

      </div>

    </div>

  `;

}


function kpi(
  label,
  value,
  note=""
){

  return `

    <div class="kpi">

      <label>
        ${esc(label)}
      </label>

      <b>
        ${value}
      </b>

      <small>
        ${esc(note)}
      </small>

    </div>

  `;

}


function row(
  label,
  value
){

  return `

    <div class="row">

      <span>
        ${esc(label)}
      </span>

      <b>
        ${value}
      </b>

    </div>

  `;

}


function destroyChart(){

  if(chart){

    chart.destroy();

    chart = null;

  }

}


function setActive(
  page
){

  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.page ===
          page
        );

      }
    );

}


/* =========================================================
   API CACHE
   ========================================================= */

api.mem = {};

const API_CACHE_TTL =
  2 * 60 * 1000;


async function api(
  action,
  params={},
  force=false
){

  const key =
    action +
    "|" +
    JSON.stringify(params);


  if(
    !force &&
    api.mem[key]
  ){

    const saved =
      api.mem[key];

    if(
      Date.now() -
      saved.time <
      API_CACHE_TTL
    ){

      return saved.data;

    }

  }


  const query =
    new URLSearchParams({

      action,

      ...params

    });


  if(force){

    query.set(
      "_",
      Date.now()
    );

    // Also bypass the server-side CacheService cache
    // (see api.gs), not just this browser-side cache.
    query.set(
      "nocache",
      "1"
    );

  }


  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () =>
        controller.abort(),
      30000
    );


  let response;


  try{

    response =
      await fetch(
        API +
        "?" +
        query.toString(),
        {
          signal:
            controller.signal
        }
      );

  }catch(error){

    if(
      error.name ===
      "AbortError"
    ){

      throw new Error(
        "Dashboard API took more than 30 seconds to respond."
      );

    }

    throw error;

  }finally{

    clearTimeout(
      timer
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      "API request failed (" +
      response.status +
      ")"
    );

  }


  const result =
    await response.json();


  if(
    result.success === false
  ){

    throw new Error(
      result.error ||
      "API error"
    );

  }


  api.mem[key] = {

    time:
      Date.now(),

    data:
      result

  };


  return result;

}


/* =========================================================
   PROJECT DATA
   ========================================================= */

async function projectsList(force=false){

  if(
    state.projects &&
    !force
  ){

    return state.projects;

  }


  const result =
    await api(
      "projectList",
      {},
      force
    );


  state.projects =
    result.data ||
    [];


  return state.projects;

}


function projectOptions(
  selected="ALL"
){

  return `

    <option
      value="ALL"
      ${
        selected === "ALL"
          ? "selected"
          : ""
      }
    >
      All Projects
    </option>

  ` +

  (
    state.projects ||
    []
  )
  .map(
    project => {

      const id =
        project["Project ID"] ||
        project.projectId;

      const name =
        project["Project Name"] ||
        project.projectName;

      return `

        <option
          value="${esc(id)}"
          ${
            selected === id
              ? "selected"
              : ""
          }
        >

          ${esc(name)}

        </option>

      `;

    }
  )
  .join("");

}


function filter(
  selected,
  callback
){

  return `

    <div class="filter">

      <label>
        Project
      </label>

      <select
        class="select"
        onchange="
          ${callback}(this.value)
        "
      >

        ${
          projectOptions(
            selected
          )
        }

      </select>

    </div>

  `;

}


/* =========================================================
   MANAGEMENT CACHE
   ========================================================= */

async function getMgmt(
  projectId="ALL",
  force=false
){

  const key =
    projectId ||
    "ALL";


  if(
    !force &&
    state.mgmt[key]
  ){

    return state.mgmt[key];

  }


  const result =
    await api(
      "management",
      {
        id:key
      },
      force
    );


  state.mgmt[key] =
    result;


  return result;

}


/* =========================================================
   HOME
   ========================================================= */

async function home(
  force=false
){

  setActive(
    "home"
  );


  destroyChart();


  const rootEl =
    document.getElementById(
      "root"
    );


  /*
     Render HOME shell immediately.
     User sees the dashboard immediately
     while the API loads the actual numbers.
  */

  rootEl.innerHTML =

    top(
      "Company Dashboard",
      "Overall performance across Earthen Spaces.",

      `

        <button
          class="btn"
          onclick="home(true)"
        >
          ↻ Refresh
        </button>

      `
    )

    +

    `

      <div class="grid g6">

        ${kpi(
          "Projects",
          "…",
          "Loading"
        )}

        ${kpi(
          "Leads",
          "…",
          "Loading"
        )}

        ${kpi(
          "Site Visits",
          "…",
          "Loading"
        )}

        ${kpi(
          "Bookings",
          "…",
          "Loading"
        )}

        ${kpi(
          "Collections",
          "…",
          "Loading"
        )}

        ${kpi(
          "Net Cash",
          "…",
          "Loading"
        )}

      </div>

    `

    +

    `

      <div class="sec">

        <div class="sec-head">

          <h2>
            Projects Overview
          </h2>

          <span class="sub">
            Loading live data…
          </span>

        </div>

        <div class="project-grid">

          <div class="card loading">
            Loading projects…
          </div>

          <div class="card loading">
            Loading projects…
          </div>

          <div class="card loading">
            Loading projects…
          </div>

        </div>

      </div>

    `

    +

    `

      <div class="sec grid g2">

        <div
          class="card loading"
          style="min-height:290px"
        >
          Loading business trend…
        </div>

        <div
          class="card loading"
          style="min-height:290px"
        >
          Loading inventory…
        </div>

      </div>

    `

    +

    `

      <div class="sec grid g2">

        <div
          class="card loading"
          style="min-height:290px"
        >
          Loading cash flow…
        </div>

        <div
          class="card loading"
          style="min-height:290px"
        >
          Loading finance snapshot…
        </div>

      </div>

    `;


  try{

    const dashboard =
      await api(
        "dashboard",
        {},
        force
      );


    state.dashboard =
      dashboard;


    state.projects =
      dashboard.projects ||
      [];


    const k =
      dashboard.kpis ||
      {};


    const inv =
      dashboard.inventory ||
      {};


    const finance =
      dashboard.finance ||
      {};


    const monthly =
      dashboard.monthly ||
      {};


    rootEl.innerHTML =

      top(
        "Company Dashboard",
        "Overall performance across Earthen Spaces.",

        `

          <button
            class="btn"
            onclick="home(true)"
          >
            ↻ Refresh
          </button>

        `
      )

      +

      `

        <div class="grid g6">

          ${kpi(
            "Projects",
            k.totalProjects || 0,
            "Portfolio"
          )}

          ${kpi(
            "Leads",
            k.totalLeads || 0,
            "All sources"
          )}

          ${kpi(
            "Site Visits",
            k.totalSiteVisits || 0,
            `${k.firstVisits || 0} first · ${k.revisits || 0} revisit`
          )}

          ${kpi(
            "Bookings",
            k.totalBookings || 0,
            money(
              k.totalBookingValue
            )
          )}

          ${kpi(
            "Collections",
            money(
              k.totalCollections
            ),
            "CRM collections"
          )}

          ${kpi(
            "Net Cash",
            money(
              k.netCashPosition
            ),
            "Current position"
          )}

        </div>

      `

      +

      `

        <div class="sec">

          <div class="sec-head">

            <h2>
              Projects Overview
            </h2>

            <span class="sub">
              Click a project
            </span>

          </div>

          <div class="project-grid">

            ${
              state.projects
                .map(
                  projectCard
                )
                .join("")
            }

          </div>

        </div>

      `

      +

      `

        <div class="sec grid g2">

          <div class="card">

            <div class="sec-head">

              <h2>
                Monthly Business Trend
              </h2>

              <span class="sub">
                Leads · Visits · Bookings
              </span>

            </div>

            <div class="chart">

              <canvas id="trend"></canvas>

            </div>

          </div>


          <div class="card">

            <div class="sec-head">

              <h2>
                Inventory
              </h2>

              <span class="sub">
                ${inv.total || 0} units
              </span>

            </div>

            <div class="chart">

              <canvas id="inventory"></canvas>

            </div>

          </div>

        </div>

      `

      +

      `

        <div class="sec grid g2">

          <div class="card">

            <div class="sec-head">

              <h2>
                Monthly Cash Flow
              </h2>

              <span class="sub">
                Inflow vs Outflow
              </span>

            </div>

            <div class="chart">

              <canvas id="cash"></canvas>

            </div>

          </div>


          <div class="card">

            <div class="sec-head">

              <h2>
                Finance Snapshot
              </h2>

            </div>

            ${row(
              "Collections",
              money(
                finance.collections
              )
            )}

            ${row(
              "Project Payments",
              money(
                finance.projectPayments
              )
            )}

            ${row(

function projectCard(
  project
){

  const total =
    n(
      project.units
    );


  const booked =
    n(
      project.bookedUnits
    );


  const percentage =
    total
      ? Math.min(
          100,
          booked /
          total *
          100
        )
      : 0;


  const id =
    project.projectId ||
    project["Project ID"];


  return `

    <div
      class="project"
      onclick="
        openProject(
          '${esc(id)}'
        )
      "
    >

      <div class="eyebrow">

        ${esc(id)}

        ·

        ${esc(
          project.location ||
          project["Location"] ||
          ""
        )}

      </div>


      <div class="pname">

        ${esc(
          project.projectName ||
          project["Project Name"]
        )}

      </div>


      <div class="sub">

        ${esc(
          project.status ||
          project["Project Status"] ||
          ""
        )}

        · Completion

        ${esc(
          project.expectedCompletion ||
          project["Expected Completion"] ||
          "—"
        )}

      </div>


      <div class="prog">

        <span
          style="
            width:${percentage}%
          "
        ></span>

      </div>


      <div class="pstats">

        <div>

          <small>
            Units
          </small>

          <strong>
            ${total}
          </strong>

        </div>


        <div>

          <small>
            Booked
          </small>

          <strong>
            ${booked}
          </strong>

        </div>


        <div>

          <small>
            Leads
          </small>

          <strong>
            ${n(
              project.leads
            )}
          </strong>

        </div>

      </div>

    </div>

  `;

}

    await projectsList();

      await getMgmt(

      result.cashFlow ||

      result.marketing?.payments ||
      [];


    const projectPayments =
      result.financeProjectPayments ||
      0;


    const companyExpenses =
      result.companyExpenses ||
      [];


    const marketingTotal =
      marketingPayments.reduce(
        (
          sum,
          row
        ) =>
          sum +
          n(
            row["Amount"]
          ),
        0
      );


    const expensesTotal =
      companyExpenses.reduce(

          sum,
          row
        ) =>
          sum +
          n(

        0
      );


    root.innerHTML =

      top(

          )}

            "Marketing",
            money(
              marketingTotal
            ),
            "Marketing payments"
          )}

            )}

              money(

/* =========================================================
   MONTH LABEL
   ========================================================= */

function monthLabel(
  value
){

  if(
    !/^\d{4}-\d{2}$/.test(
      value || ""
    )
  ){

    return value || "";

  }


  const [
    year,
    month
  ] =
    value.split("-");


  const names = [

    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"

  ];


  return (

    names[
      Number(month) - 1
    ]

    +

    "-" +

    year

  );

}
