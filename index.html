<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earthen Spaces — Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --soil-900:#2b2420;
  --soil-700:#4a3f36;
  --limestone:#f2ede3;
  --limestone-dim:#e6ded0;
  --clay:#a8543a;
  --moss:#5c6e4a;
  --moss-soft:#eef1e8;
  --clay-soft:#f7e9e2;
  --slate:#6b6459;
  --line:#d9d0c0;
  --card:#fbf9f4;
  --amber:#b5843a;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--limestone);color:var(--soil-900);font-family:'Inter',sans-serif;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}

header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;border-bottom:1px solid var(--line);
  background:var(--limestone);position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand img.logo{height:32px;width:auto;display:block;}
.brand .mark{width:10px;height:10px;background:var(--clay);border-radius:2px;display:inline-block;}
.brand span{font-size:19px;font-weight:600;}
.crumbs{font-size:13px;color:var(--slate);}
.crumbs a:hover{color:var(--clay);}
.live-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--slate);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--moss);}

main{max-width:1180px;margin:0 auto;padding:36px 32px 80px;}

.hero-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:24px;flex-wrap:wrap;}
.hero-row h1{font-size:34px;font-weight:500;margin:0;}
.hero-row p{margin:6px 0 0;color:var(--slate);font-size:15px;max-width:520px;}
.rollup{display:flex;gap:28px;flex-wrap:wrap;}
.rollup .stat{text-align:right;}
.rollup .stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:500;}
.rollup .stat .lbl{font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;}

.grid-projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:22px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;position:relative;transition:border-color .15s;}
.pcard.active{cursor:pointer;}
.pcard.active:hover{border-color:var(--clay);}
.pcard .loc{font-size:12px;color:var(--slate);margin-bottom:2px;}
.pcard h3{font-size:19px;margin:0;font-weight:500;}
.pcard.soon{opacity:.5;}
.pcard.soon::after{content:"Not yet connected";position:absolute;top:20px;right:20px;font-size:10.5px;color:var(--slate);}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:24px;}
.dtile{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;}
.dtile.active{cursor:pointer;}
.dtile.active:hover{border-color:var(--clay);}
.dtile .name{font-size:14.5px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.dtile .headline{font-family:'Fraunces',serif;font-size:24px;font-weight:500;}
.dtile .sub{font-size:12px;color:var(--slate);margin-top:2px;}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--moss-soft);color:var(--moss);}
.tag.soon{background:var(--limestone-dim);color:var(--slate);}

.finrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:24px;}
.fincard{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;}
.fincard .lbl{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.03em;}
.fincard .val{font-family:'Fraunces',serif;font-size:20px;margin-top:6px;}

.section-title{font-size:20px;font-weight:500;margin:40px 0 4px;}
.section-sub{font-size:13px;color:var(--slate);margin-bottom:16px;}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filters select, .filters input{
  font-family:'Inter';font-size:13px;padding:7px 10px;border:1px solid var(--line);
  background:var(--card);border-radius:3px;color:var(--soil-900);
}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.kpi-row.cols-4{grid-template-columns:repeat(4,1fr);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;}
.kpi .lbl{font-size:11.5px;color:var(--slate);}
.kpi .val{font-family:'Fraunces',serif;font-size:24px;margin-top:6px;font-weight:500;}
.kpi .delta{font-size:11.5px;margin-top:4px;}
.delta.up{color:var(--moss);} .delta.down{color:var(--clay);}

.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;margin-top:16px;}
.panel h3{margin:0 0 14px;font-size:15px;font-weight:600;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
canvas{max-height:260px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate);padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--limestone-dim);}
tr:last-child td{border-bottom:none;}
.src-badge{font-size:11px;padding:2px 8px;border-radius:20px;}
.src-Marketing{background:#eef1e8;color:var(--moss);}
.src-CP{background:#f7e9e2;color:var(--clay);}
.src-Presales{background:#f0e8f5;color:#7a4f96;}
.src-Sales{background:#eaf1f6;color:#3d6f8f;}
.status-done{background:#eef1e8;color:var(--moss);}
.status-pending{background:#faf1e0;color:var(--amber);}
.status-notstarted{background:#f7e9e2;color:var(--clay);}

.trace{font-size:11px;color:var(--slate);margin-top:8px;}
.trace .mono{color:var(--slate);}

.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.field label{display:block;font-size:12px;color:var(--slate);margin-bottom:5px;}
.field input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;background:#fff;}
.btn{background:var(--soil-900);color:var(--limestone);border:none;padding:10px 18px;border-radius:3px;font-size:13px;cursor:pointer;margin-top:16px;}
.btn:hover{background:var(--clay);}
.saved-msg{font-size:12px;color:var(--moss);margin-top:10px;display:none;}

.empty-state{background:var(--card);border:1px dashed var(--line);border-radius:4px;padding:28px;text-align:center;color:var(--slate);font-size:13px;margin-top:20px;}
.empty-state .mono{display:block;margin-top:8px;font-size:12px;}
.empty-state ul{text-align:left;max-width:420px;margin:12px auto 0;font-size:12.5px;}

footer{max-width:1180px;margin:0 auto;padding:0 32px 60px;color:var(--slate);font-size:12px;}
.back-link{font-size:13px;color:var(--slate);display:inline-block;margin-bottom:18px;}
.back-link:hover{color:var(--clay);}
.summary-line{font-size:13px;color:var(--slate);margin-bottom:14px;}
</style>
</head>
<body>

<header class="top">
  <div class="brand" onclick="nav('home')">
    <span id="brandMark"></span><span>Earthen Spaces</span>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div class="live-pill"><span class="dot"></span><span id="lastUpdated">Synced</span></div>
</header>

<main id="app"></main>
<footer id="foot"></footer>

<script>
/* ---------- BRAND / LOGO ----------
   Paste a hosted image URL (png/svg/jpg) here to show your company logo in the
   header instead of the plain color mark. Leave blank to keep the mark. */
const COMPANY_LOGO_URL = '';
document.getElementById('brandMark').innerHTML = COMPANY_LOGO_URL
  ? `<img class="logo" src="${COMPANY_LOGO_URL}" alt="Earthen Spaces">`
  : `<span class="mark"></span>`;

/* ---------- LIVE DATA CONFIG ---------- */
const DATA_API_URL = 'https://script.google.com/macros/s/AKfycbwL0Rp36wPB54cHNGla6wjlU6qsSgM6lhvnVA5cNVpx-aaFQG0fH2G3Dblgwke8f8U/exec';

/* Tabs the v3 Apps Script currently reads/writes — keep in sync with WIRED_SHEETS in AppsScript_Code_v3.gs */
const WIRED_SHEETS = [
  'Approvals','VV_Projects_Budget','VV_Projects_Workorder','VV_Project_SiteStatus',
  'VV_Marketing_Targets','VV_Marketing_Vendor','VV_Marketing_GTMPlan',
  'Sales_Bookings','VV_Inventory','Incentive_Targets','SiteVisit'
];

/* Refresh cadence: twice a day (every 12 hours), not every few seconds. */
const REFRESH_INTERVAL_MS = 12 * 60 * 60 * 1000;

async function fetchLiveData(){
  if(!DATA_API_URL) return null;
  try{
    const res = await fetch(DATA_API_URL);
    if(!res.ok) throw new Error('bad response');
    return await res.json();
  }catch(err){
    console.warn('Live fetch failed, staying on mock data:', err);
    return null;
  }
}

function safe(fn, fallback){
  try{ const v = fn(); return (v===undefined||v===null||Number.isNaN(v)) ? fallback : v; }
  catch(e){ return fallback; }
}
function sum(rows, key){ return (rows||[]).reduce((s,r)=>s+Number(r[key]||0),0); }
function isSheetLive(name){ return !!DATA_API_URL && !!(store.vv.rawSheets[name] && store.vv.rawSheets[name].length); }
function statusClass(status){
  const s = String(status||'').toLowerCase();
  if(s==='done'||s==='completed') return 'status-done';
  if(s==='pending'||s==='scheduled') return 'status-pending';
  return 'status-notstarted';
}

/* ---------- LIVE DATA MAPPING ---------- */
function mapLiveDataToStore(data){
  if(!data || !data.sheets) return;
  const S = data.sheets;
  store.vv.rawSheets = S;

  if(S.Approvals && S.Approvals.length) store.vv.approvalsRows = S.Approvals;

  if(S.VV_Projects_Budget) store.vv.projects.budgetRows = S.VV_Projects_Budget;
  if(S.VV_Project_SiteStatus) store.vv.projects.siteStatus = S.VV_Project_SiteStatus;
  if(S.VV_Payment_Tracker) store.vv.projects.paymentTracker = S.VV_Payment_Tracker;

  if(S.Sales_Bookings) store.vv.sales.bookingsRows = S.Sales_Bookings;
  if(S.VV_Inventory && S.VV_Inventory.length){
    const byType = {};
    S.VV_Inventory.forEach(u => {
      const t = u['Project'] || 'Unit';
      byType[t] = byType[t] || {type:t, total:0, sold:0, avail:0, price:''};
      byType[t].total++;
      if(String(u['Availabality']).trim() === 'Booked') byType[t].sold++; else byType[t].avail++;
      byType[t].price = u['Rate per Sq.ft'] ? `₹${u['Rate per Sq.ft']}/sqft` : '';
    });
    store.vv.sales.inventory = Object.values(byType);
  }
  if(S.SiteVisit) store.vv.sales.siteVisits = S.SiteVisit;

  if(S.VV_Marketing_Vendor) store.vv.marketing.vendor = S.VV_Marketing_Vendor;
  if(S.VV_Marketing_GTMPlan) store.vv.marketing.gtm = S.VV_Marketing_GTMPlan;

  store.companyRollup.activeUnits = safe(()=>store.vv.sales.inventory.reduce((a,i)=>a+Number(i.sold||0),0), store.companyRollup.activeUnits);
}

async function refreshFromApi(){
  const data = await fetchLiveData();
  if(data){
    mapLiveDataToStore(data);
    document.getElementById('lastUpdated').textContent = 'Synced ' + new Date().toLocaleString();
    render();
  }
}

/* ---------- MOCK DATA STORE ---------- */
const projectsList = [
  {id:'vista-villas', name:'Vista Villas', loc:'Kelambakkam, OMR', live:true},
  {id:'old-madras', name:'Old Madras', loc:'Old Madras Road', live:false},
  {id:'nagaram', name:'Nagaram', loc:'Nagaram', live:false},
];

const depts = ['Approvals','Projects','Marketing','Pre-sales','Sales','CP','CRM','Incentive'];
const deptRoute = {
  'Approvals':'approvals', 'Projects':'projects', 'Marketing':'marketing',
  'Sales':'sales', 'Pre-sales':'presales', 'CP':'cp', 'CRM':'crm', 'Incentive':'incentive'
};

let store = {
  companyRollup: { revenue: 184.2, collections: 61.5, activeUnits: 612 },
  vv: {
    approvalsRows: [
      {Stage:'Layout approval', Status:'Done'},
      {Stage:'Environmental clearance', Status:'Done'},
      {Stage:'Building plan sanction', Status:'Pending'},
      {Stage:'Fire NOC', Status:'Not started'},
    ],
    rawSheets: {},
    projects: {
      budgetRows: [], // VV_Projects_Budget — not yet returning rows
      siteStatus: [
        {Unit:'V-101', Type:'Villa 3BHK', 'Current Stage':'Roof slab', 'Completion Date':'2024-11-15'},
        {Unit:'V-102', Type:'Villa 3BHK', 'Current Stage':'Foundation', 'Completion Date':'2025-01-20'},
      ],
      paymentTracker: null // expects a VV_Payment_Tracker tab once added to the sheet
    },
    marketing: {
      vendor: [
        {Vendor:'Meta Ads', Category:'Digital', Budget:6.0, 'Spend (Rs L)':4.2, Leads:210},
        {Vendor:'99acres', Category:'Portal', Budget:2.5, 'Spend (Rs L)':1.8, Leads:95},
      ],
      gtm: [
        {Date:'2024-08-05', Activity:'Site walkthrough event', Type:'On-ground', 'Planned/Actual':'Actual', Notes:'42 attendees'},
        {Date:'2024-08-20', Activity:'Instagram reel campaign', Type:'Digital', 'Planned/Actual':'Planned', Notes:''},
      ]
    },
    sales: {
      inventory: [
        {type:'Villa · 3BHK', total:120, sold:74, avail:46, price:'₹2.4 Cr'},
        {type:'Villa · 4BHK', total:60, sold:39, avail:21, price:'₹3.1 Cr'},
        {type:'Plot · 2400 sqft', total:180, sold:112, avail:68, price:'₹0.95 Cr'},
        {type:'Plot · 3000 sqft', total:90, sold:41, avail:49, price:'₹1.2 Cr'},
      ],
      bookingsRows: [
        {'Customer Name':'R. Sundaram','Booking Date':'2024-08-14',Project:'Vista Villas','Unit No':'V-101','Total Value':24000000,Source:'Marketing'},
        {'Customer Name':'K. Priya','Booking Date':'2024-08-16',Project:'Vista Villas','Unit No':'P-233','Total Value':9500000,Source:'CP'},
      ],
      siteVisits: [
        {'Lead Id':'LD-2291','Site Visit Date':'2024-08-14', Project:'Vista Villas', Status:'Done', Source:'Marketing'},
        {'Lead Id':'LD-2305','Site Visit Date':'2024-08-16', Project:'Vista Villas', Status:'Scheduled', Source:'CP'},
      ],
      leads: [
        {name:'R. Sundaram', source:'Marketing', stage:'Site visit done', updated:'2h ago'},
        {name:'K. Priya', source:'CP', stage:'Booking in progress', updated:'4h ago'},
        {name:'A. Fernandez', source:'Sales', stage:'Prospect', updated:'1d ago'},
        {name:'M. Iqbal', source:'Pre-sales', stage:'Site visit scheduled', updated:'1d ago'},
        {name:'S. Lakshmi', source:'CP', stage:'Booked', updated:'2d ago'},
      ]
    }
  }
};

let charts = {};

/* ---------- generic helpers ---------- */
function genericTable(rows, cols){
  if(!rows || !rows.length) return `<div class="empty-state">No rows in this sheet yet.</div>`;
  const c = cols || Object.keys(rows[0]);
  return `<table><thead><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${c.map(x=>`<td>${r[x]!==undefined&&r[x]!==''?r[x]:'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderNotWired(name, needs){
  return `
  <a class="back-link" href="#project/vista-villas">← Vista Villas</a>
  <div class="hero-row"><div><h1>${name}</h1><p>No sheet tab is wired for ${name} yet.</p></div></div>
  <div class="empty-state">
    Add a tab to the spreadsheet covering what this page needs, list it in
    <span class="mono">WIRED_SHEETS</span> in the Apps Script, and redeploy — this page will pick it up automatically.
    <ul>${needs.map(n=>`<li>${n}</li>`).join('')}</ul>
  </div>`;
}

/* ---------- ROUTER ---------- */
function nav(route){ location.hash = route; }
window.addEventListener('hashchange', render);

function render(){
  const hash = location.hash.replace('#','') || 'home';
  const parts = hash.split('/');
  const app = document.getElementById('app');
  const crumbs = document.getElementById('crumbs');
  const crumbBase = `<a href="#home">Home</a> / <a href="#project/vista-villas">Vista Villas</a> / `;

  if(parts[0]==='home'){
    crumbs.innerHTML = '';
    app.innerHTML = renderHome();
  } else if(parts[0]==='project' && parts[1]==='vista-villas'){
    crumbs.innerHTML = `<a href="#home">Home</a> / Vista Villas`;
    app.innerHTML = renderProject();
  } else if(parts[0]==='dept' && parts[1]==='vista-villas'){
    const d = parts[2];
    const titles = {approvals:'Approvals',projects:'Projects',marketing:'Marketing',sales:'Sales',presales:'Pre-sales',cp:'CP',crm:'CRM',incentive:'Incentive'};
    crumbs.innerHTML = crumbBase + (titles[d]||'');
    if(d==='approvals'){ app.innerHTML = renderApprovalsDept(); }
    else if(d==='projects'){ app.innerHTML = renderProjectsDept(); }
    else if(d==='marketing'){ app.innerHTML = renderMarketingDept(); }
    else if(d==='sales'){ app.innerHTML = renderSalesDept(); }
    else if(d==='presales'){ app.innerHTML = renderNotWired('Pre-sales — Calling report', ['A tab (e.g. Calling_Report) with columns like Presales Name, Calls Made, Connected, Follow-ups, Date']); }
    else if(d==='cp'){ app.innerHTML = renderNotWired('CP', ['CPs onboarded (a roster tab)','Active CPs this period','CP-wise earning report (commission by CP)','Project-wise CP contribution']); }
    else if(d==='crm'){ app.innerHTML = renderNotWired('CRM', ['Collection targets','Amounts collected','Customer-wise account statement']); }
    else if(d==='incentive'){ app.innerHTML = renderIncentiveDept(); setTimeout(renderIncentiveChart,0); }
    else { location.hash='home'; return; }
  } else {
    location.hash = 'home';
    return;
  }
  document.getElementById('foot').innerHTML =
    `Vista Villas — data syncs twice a day from your live sheet. CP and CRM have no source tab yet.`;
}

/* ---------- HOME ---------- */
function renderHome(){
  const r = store.companyRollup;
  return `
  <div class="hero-row">
    <div><h1>All projects</h1></div>
  </div>
  <div class="grid-projects">
    ${projectsList.map(p => `
      <div class="pcard ${p.live?'active':'soon'}" ${p.live?`onclick="nav('project/${p.id}')"`:''}>
        <div class="loc">${p.loc}</div>
        <h3>${p.name}</h3>
      </div>
    `).join('')}
  </div>`;
}

/* ---------- PROJECT PAGE ---------- */
function renderProject(){
  return `
  <a class="back-link" href="#home">← All projects</a>
  <div class="hero-row">
    <div><h1>Vista Villas</h1><p>Kelambakkam, OMR</p></div>
  </div>
  <div class="dept-grid">
    ${depts.map(dn => {
      const route = deptRoute[dn];
      const wiredTabByDept = {
        Approvals:'Approvals', Projects:'VV_Projects_Budget', Sales:'Sales_Bookings',
        Marketing:'VV_Marketing_Vendor', Incentive:'Incentive_Targets'
      };
      const tab = wiredTabByDept[dn];
      const isLive = tab ? isSheetLive(tab) : false;
      const isWired = !!tab;
      return `
      <div class="dtile active" onclick="nav('dept/vista-villas/${route}')">
        <div class="name">${dn} ${isLive?'<span class="tag">Live</span>':(isWired?'<span class="tag soon">Mock</span>':'<span class="tag soon">Not wired</span>')}</div>
        <div class="sub">${isWired?'Full report available':'No sheet tab yet — click for details'}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- APPROVALS (simplified: list + status only) ---------- */
function renderApprovalsDept(){
  const rows = store.vv.approvalsRows;
  const done = rows.filter(r=>r.Status==='Done').length;
  return `
  <a class="back-link" href="#project/vista-villas">← Vista Villas</a>
  <div class="hero-row"><div><h1>Approvals</h1></div></div>
  <div class="summary-line">${done} of ${rows.length} approvals done ${isSheetLive('Approvals')?'· live':'· mock'}</div>

  <div class="panel">
    <table>
      <thead><tr><th>Approval</th><th>Status</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr><td>${r.Stage||r.Approvals||'—'}</td><td><span class="src-badge ${statusClass(r.Status)}">${r.Status||'—'}</span></td></tr>`).join('')}
      </tbody>
    </table>
  </div>

  <div class="section-title">Add a new approval</div>
  <div class="section-sub">${DATA_API_URL ? 'Writes directly to the Approvals tab.' : 'Connect DATA_API_URL to enable writing to the sheet.'}</div>
  <div class="panel">
    <div class="form-grid">
      <div class="field"><label>Approval</label><input type="text" id="entry-appr-0"></div>
      <div class="field"><label>Status</label><input type="text" id="entry-appr-5" placeholder="Not started / Pending / Done"></div>
    </div>
    <button class="btn" onclick="submitApproval()">Add</button>
    <div class="saved-msg" id="saved-msg-appr">Saved — synced to Approvals</div>
  </div>
  `;
}

async function submitApproval(){
  const row = {
    'Approvals': document.getElementById('entry-appr-0').value,
    'Status': document.getElementById('entry-appr-5').value
  };
  if(DATA_API_URL){
    try{ await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({action:'appendRow', sheet:'Approvals', row}) }); }
    catch(err){ console.warn('Write failed:', err); }
  }
  document.getElementById('saved-msg-appr').style.display='block';
  await refreshFromApi();
}

/* ---------- PROJECTS (Budget, Spend, Balance, Payment tracker, Site stats) ---------- */
function renderProjectsDept(){
  const p = store.vv.projects;
  const budget = sum(p.budgetRows,'Budget');
  const spend = sum(p.budgetRows,'Spent') || sum(p.budgetRows,'Actual');
  const balance = budget - spend;
  const hasBudgetData = p.budgetRows.length > 0;

  return `
  <a class="back-link" href="#project/vista-villas">← Vista Villas</a>
  <div class="hero-row"><div><h1>Projects</h1></div></div>

  <div class="kpi-row">
    <div class="kpi"><div class="lbl">Budget</div><div class="val">${hasBudgetData?`₹${(budget/10000000).toFixed(1)} Cr`:'—'}</div></div>
    <div class="kpi"><div class="lbl">Spend</div><div class="val">${hasBudgetData?`₹${(spend/10000000).toFixed(1)} Cr`:'—'}</div></div>
    <div class="kpi"><div class="lbl">Balance</div><div class="val">${hasBudgetData?`₹${(balance/10000000).toFixed(1)} Cr`:'—'}</div></div>
  </div>
  ${!hasBudgetData?`<div class="trace">VV_Projects_Budget has no rows yet — add Budget/Spent columns to populate this.</div>`:''}

  <div class="panel" style="margin-top:16px;">
    <h3>Payment tracker</h3>
    ${p.paymentTracker ? genericTable(p.paymentTracker) : `<div class="empty-state">No payment tracker tab yet.<span class="mono">Add a "VV_Payment_Tracker" tab (e.g. Milestone, Due Date, Amount Due, Amount Received, Status) and list it in WIRED_SHEETS.</span></div>`}
  </div>

  <div class="panel" style="margin-top:16px;">
    <h3>Site stats</h3>
    ${genericTable(p.siteStatus)}
    <div class="trace">Source: <span class="mono">VV_Project_SiteStatus${isSheetLive('VV_Project_SiteStatus')?' (live)':''}</span></div>
  </div>
  `;
}

/* ---------- INCENTIVE (kept simple, still useful for payouts) ---------- */
function renderIncentiveDept(){
  const rows = store.vv.rawSheets.Incentive_Targets || [
    {Month:'Aug-24', Team:'Team A', Metric:'Bookings', Target:20, Achieved:16, Required:4},
    {Month:'Aug-24', Team:'Team B', Metric:'Bookings', Target:18, Achieved:15, Required:3},
  ];
  const months = [...new Set(rows.map(r=>r.Month))];
  const latestMonth = months[months.length-1];
  const monthRows = rows.filter(r=>r.Month===latestMonth);

  return `
  <a class="back-link" href="#project/vista-villas">← Vista Villas</a>
  <div class="hero-row"><div><h1>Incentive</h1><p>Latest month: ${latestMonth||'—'}</p></div></div>
  <div class="panel">
    <h3>Target vs achieved by team</h3>
    <canvas id="chartIncentive"></canvas>
    <div class="trace">Source: <span class="mono">Incentive_Targets${isSheetLive('Incentive_Targets')?' (live)':''}</span></div>
  </div>
  <div class="panel" style="margin-top:16px;">
    <h3>All rows</h3>
    ${genericTable(rows)}
  </div>
  `;
}
function renderIncentiveChart(){
  const rows = store.vv.rawSheets.Incentive_Targets || [
    {Month:'Aug-24', Team:'Team A', Target:20, Achieved:16},
    {Month:'Aug-24', Team:'Team B', Target:18, Achieved:15},
  ];
  const months = [...new Set(rows.map(r=>r.Month))];
  const latestMonth = months[months.length-1];
  const monthRows = rows.filter(r=>r.Month===latestMonth);
  const ctx = document.getElementById('chartIncentive');
  if(!ctx) return;
  if(charts.incentive) charts.incentive.destroy();
  charts.incentive = new Chart(ctx, {
    type:'bar',
    data:{ labels:monthRows.map(r=>r.Team), datasets:[
      {label:'Target', data:monthRows.map(r=>Number(r.Target||0)), backgroundColor:'#d9d0c0', borderRadius:2},
      {label:'Achieved', data:monthRows.map(r=>Number(r.Achieved||0)), backgroundColor:'#5c6e4a', borderRadius:2}
    ]},
    options:{ responsive:true, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}}, scales:{ y:{beginAtZero:true, grid:{color:'#e6ded0'}}, x:{grid:{display:false}} } }
  });
}

render();
if(DATA_API_URL){
  refreshFromApi();
  setInterval(refreshFromApi, REFRESH_INTERVAL_MS);
} else {
  document.getElementById('lastUpdated').textContent = 'Mock data';
}
</script>
