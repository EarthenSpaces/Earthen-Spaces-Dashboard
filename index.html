<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Earthen Spaces Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================================================
   BASE
   ========================================================= */

:root{

  --green:#17372f;
  --green2:#2d604f;
  --green3:#3f8067;

  --paper:#f5f3ec;
  --white:#ffffff;

  --line:#e3e0d7;
  --muted:#68746d;

  --gold:#b38a47;
  --red:#b9574c;
  --blue:#5d829d;

  --shadow:0 6px 22px rgba(23,55,47,.07);

}

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:var(--paper);

  color:var(--green);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}

button,
select,
input{

  font:inherit;

}

button{

  cursor:pointer;

}

/* =========================================================
   LAYOUT
   ========================================================= */

.app{

  min-height:100vh;

  display:flex;

}

.sidebar{

  position:fixed;

  left:0;
  top:0;
  bottom:0;

  width:250px;

  background:var(--green);

  color:#fff;

  padding:22px 15px;

  overflow:auto;

}

.brand{

  padding:5px 12px 23px;

  border-bottom:
    1px solid rgba(255,255,255,.12);

  margin-bottom:15px;

}

.brand h1{

  margin:0;

  font-family:Georgia,serif;

  font-size:27px;

  font-weight:500;

  line-height:.94;

}

.brand small{

  display:block;

  margin-top:10px;

  font-size:9px;

  letter-spacing:.14em;

  opacity:.65;

}

.nav button{

  width:100%;

  border:0;

  background:transparent;

  color:#dce9e3;

  text-align:left;

  padding:11px 13px;

  border-radius:8px;

  margin:2px 0;

}

.nav button:hover,
.nav button.active{

  background:#2b604f;

  color:#fff;

}

.content{

  margin-left:250px;

  width:calc(100% - 250px);

  padding:27px 31px 55px;

}

/* =========================================================
   TOP
   ========================================================= */

.topbar{

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:20px;

  margin-bottom:20px;

}

.page-title{

  margin:0 0 5px;

  font-family:Georgia,serif;

  font-size:34px;

  font-weight:500;

}

.sub{

  color:var(--muted);

}

.actions{

  display:flex;

  align-items:center;

  gap:9px;

  flex-wrap:wrap;

}

.btn,
.select{

  background:#fff;

  border:1px solid var(--line);

  color:var(--green);

  border-radius:7px;

  padding:9px 12px;

}

.btn.primary{

  background:var(--green);

  color:#fff;

  border-color:var(--green);

}

.status{

  display:flex;

  align-items:center;

  gap:6px;

  color:var(--muted);

  font-size:12px;

}

.status i{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green3);

}

/* =========================================================
   FILTER
   ========================================================= */

.filterbar{

  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:9px;

  margin-bottom:15px;

}

.filterbar label{

  font-size:10px;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.07em;

}

/* =========================================================
   GRIDS
   ========================================================= */

.grid6{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:11px;

}

.grid5{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:11px;

}

.grid4{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:11px;

}

.grid3{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:11px;

}

.grid2{

  display:grid;

  grid-template-columns:
    1.25fr 1fr;

  gap:12px;

}

/* =========================================================
   CARDS
   ========================================================= */

.card,
.kpi{

  background:var(--white);

  border:1px solid var(--line);

  border-radius:10px;

  padding:16px;

  box-shadow:var(--shadow);

}

.kpi label{

  display:block;

  font-size:10px;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.06em;

}

.kpi b{

  display:block;

  margin-top:8px;

  font-family:Georgia,serif;

  font-size:24px;

}

.kpi small{

  display:block;

  margin-top:5px;

  color:var(--muted);

  font-size:11px;

}

.section{

  margin-top:19px;

}

.section-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:11px;

}

.section-head h2{

  margin:0;

  font-family:Georgia,serif;

  font-size:19px;

}

/* =========================================================
   PROJECT CARDS
   ========================================================= */

.project-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:11px;

}

.project{

  background:#fff;

  border:1px solid var(--line);

  border-radius:10px;

  padding:17px;

  cursor:pointer;

}

.project:hover{

  box-shadow:var(--shadow);

  transform:translateY(-1px);

}

.project .eyebrow{

  font-size:11px;

  color:var(--muted);

}

.project .name{

  margin:6px 0 3px;

  font-family:Georgia,serif;

  font-size:21px;

  font-weight:600;

}

.progress{

  height:7px;

  background:#ecebe5;

  border-radius:20px;

  overflow:hidden;

  margin:14px 0;

}

.progress span{

  display:block;

  height:100%;

  background:var(--green3);

}

.project-stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

}

.project-stats small{

  font-size:10px;

  color:var(--muted);

}

.project-stats strong{

  display:block;

  margin-top:3px;

}

/* =========================================================
   TABLES
   ========================================================= */

.table-wrap{

  overflow:auto;

}

table{

  width:100%;

  border-collapse:collapse;

  font-size:12px;

}

th,
td{

  text-align:left;

  padding:9px 7px;

  border-bottom:1px solid #eeeae1;

  white-space:nowrap;

}

th{

  font-size:10px;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.05em;

}

/* =========================================================
   BADGES
   ========================================================= */

.badge{

  display:inline-block;

  padding:4px 8px;

  border-radius:20px;

  font-size:10px;

  white-space:nowrap;

}

.badge.good{

  background:#e8f2ec;

  color:#2e705a;

}

.badge.warn{

  background:#faf0dd;

  color:#906924;

}

.badge.bad{

  background:#fae8e5;

  color:#a34b43;

}

.badge.info{

  background:#eaf0f4;

  color:#4e7087;

}

/* =========================================================
   CHARTS
   ========================================================= */

.chartbox{

  position:relative;

  height:290px;

}

.chartbox.tall{

  height:340px;

}

/* =========================================================
   TABS
   ========================================================= */

.tabs{

  display:flex;

  gap:6px;

  overflow:auto;

  margin:12px 0 14px;

}

.tab{

  border:1px solid var(--line);

  background:#fff;

  color:var(--muted);

  padding:9px 12px;

  border-radius:7px;

  white-space:nowrap;

}

.tab.active{

  background:var(--green);

  color:#fff;

  border-color:var(--green);

}

/* =========================================================
   ROWS / NOTICE
   ========================================================= */

.row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  padding:10px 0;

  border-bottom:1px solid #eeeae1;

  font-size:12px;

}

.row:last-child{

  border-bottom:0;

}

.notice{

  background:#f2efe6;

  border:1px dashed #d8d0c1;

  border-radius:8px;

  padding:13px;

  color:var(--muted);

  line-height:1.55;

}

.error{

  background:#faebe8;

  border:1px solid #e5c4be;

  border-radius:9px;

  padding:14px;

  color:#9b463d;

}

.empty{

  padding:30px;

  text-align:center;

  color:var(--muted);

}

.progress-label{

  font-size:11px;

  color:var(--muted);

}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1200px){

  .grid6{

    grid-template-columns:
      repeat(3,1fr);

  }

  .grid5{

    grid-template-columns:
      repeat(3,1fr);

  }

  .grid4{

    grid-template-columns:
      repeat(2,1fr);

  }

  .grid2{

    grid-template-columns:1fr;

  }

  .project-grid{

    grid-template-columns:1fr;

  }

}

@media(max-width:760px){

  .sidebar{

    position:static;

    width:100%;

    height:auto;

  }

  .app{

    display:block;

  }

  .content{

    margin:0;

    width:100%;

    padding:20px 14px;

  }

  .nav{

    display:flex;

    overflow:auto;

  }

  .nav button{

    min-width:max-content;

  }

  .topbar{

    flex-direction:column;

    align-items:flex-start;

  }

  .grid6,
  .grid5,
  .grid4{

    grid-template-columns:
      repeat(2,1fr);

  }

}

</style>

</head>

<body>

<div class="app">

<!-- =======================================================
     SIDEBAR
     ======================================================= -->

<aside class="sidebar">

  <div class="brand">

    <h1>
      EARTHEN<br>
      SPACES
    </h1>

    <small>
      BUILDING BETTER TOMORROWS
    </small>

  </div>

  <nav class="nav">

    <button
      data-page="home"
      class="active">
      ⌂ &nbsp; Home
    </button>

    <button data-page="projects">
      ▦ &nbsp; Projects
    </button>

    <button data-page="approvals">
      ✓ &nbsp; Approvals
    </button>

    <button data-page="finance">
      ₹ &nbsp; Finance
    </button>

    <button data-page="marketing">
      ◈ &nbsp; Marketing
    </button>

    <button data-page="presales">
      ☎ &nbsp; Pre-Sales
    </button>

    <button data-page="sales">
      ▤ &nbsp; Sales
    </button>

    <button data-page="cp">
      ♧ &nbsp; Channel Partners
    </button>

    <button data-page="crm">
      ◎ &nbsp; CRM & Collections
    </button>

  </nav>

</aside>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="content">

  <div id="appRoot">

    <div class="sub">
      Loading dashboard…
    </div>

  </div>

</main>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbziG51HnCv6QSyq7EGmLQfOc4_zBLPMEAO10x0OwLnNtLroqbALgJDhvsCo2dpSda1pyw/exec";


/* =========================================================
   STATE
   ========================================================= */

const cache = {

  dashboard:null,

  projects:null,

  inventory:null,

  approvals:null,

  finance:null,

  management:{},

  project:null

};

let activeChart = null;


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function money(value){

  const n =
    num(value);

  const abs =
    Math.abs(n);

  if(abs >= 10000000){

    return "₹" +
      (n / 10000000)
        .toFixed(2) +
      " Cr";

  }

  if(abs >= 100000){

    return "₹" +
      (n / 100000)
        .toFixed(1) +
      " L";

  }

  return "₹" +
    Math.round(n)
      .toLocaleString("en-IN");

}


function badge(status){

  const s =
    String(status || "")
      .toLowerCase();

  let cls =
    "info";

  if(
    s.includes("pending") ||
    s.includes("planned") ||
    s.includes("hold")
  ){

    cls =
      "warn";

  }

  if(
    s.includes("done") ||
    s.includes("completed") ||
    s.includes("paid") ||
    s.includes("active") ||
    s.includes("ongoing")
  ){

    cls =
      "good";

  }

  if(
    s.includes("delay") ||
    s.includes("cancel") ||
    s.includes("blocked")
  ){

    cls =
      "bad";

  }

  return `
    <span class="badge ${cls}">
      ${esc(status || "—")}
    </span>
  `;

}


async function api(
  action,
  params={}
){

  const query =
    new URLSearchParams({

      action,

      ...params,

      _:Date.now()

    });

  const response =
    await fetch(
      API +
      "?" +
      query.toString()
    );

  if(!response.ok){

    throw new Error(
      "API request failed (" +
      response.status +
      ")"
    );

  }

  const result =
    await response.json();

  if(
    result.success === false
  ){

    throw new Error(
      result.error ||
      "API error"
    );

  }

  return result;

}


function setActive(page){

  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page ===
        page
      );

    });

}


function destroyChart(){

  if(activeChart){

    activeChart.destroy();

    activeChart =
      null;

  }

}


function head(
  title,
  subtitle,
  extra=""
){

  return `

    <div class="topbar">

      <div>

        <h1 class="page-title">
          ${esc(title)}
        </h1>

        <div class="sub">
          ${esc(subtitle)}
        </div>

      </div>

      <div class="actions">

        ${extra}

        <span class="status">
          <i></i>
          Live
        </span>

      </div>

    </div>

  `;

}


function kpi(
  label,
  value,
  note
){

  return `

    <div class="kpi">

      <label>
        ${esc(label)}
      </label>

      <b>
        ${value}
      </b>

      <small>
        ${esc(note)}
      </small>

    </div>

  `;

}


function financeRow(
  label,
  value
){

  return `

    <div class="row">

      <span>
        ${esc(label)}
      </span>

      <b>
        ${value}
      </b>

    </div>

  `;

}


function table(
  headers,
  rows
){

  if(!rows || !rows.length){

    return `
      <div class="empty">
        No records found.
      </div>
    `;

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            ${headers
              .map(
                h =>
                  `<th>${esc(h)}</th>`
              )
              .join("")}

          </tr>

        </thead>

        <tbody>

          ${rows
            .map(
              row => `

                <tr>

                  ${row
                    .map(
                      value =>
                        `<td>${value}</td>`
                    )
                    .join("")}

                </tr>

              `
            )
            .join("")}

        </tbody>

      </table>

    </div>

  `;

}


/* =========================================================
   PROJECT FILTER
   ========================================================= */

function projectOptions(
  selected="ALL"
){

  const projects =
    cache.projects || [];

  return `

    <option
      value="ALL"
      ${selected === "ALL"
        ? "selected"
        : ""}
    >
      All Projects
    </option>

    ${projects
      .map(
        project => `

          <option
            value="${esc(
              project["Project ID"]
              || project.projectId
            )}"

            ${
              selected ===
              (
                project["Project ID"]
                || project.projectId
              )
                ? "selected"
                : ""
            }
          >

            ${esc(
              project["Project Name"]
              || project.projectName
            )}

          </option>

        `
      )
      .join("")}

  `;

}


function filterBar(
  selected,
  callback
){

  return `

    <div class="filterbar">

      <label>
        Project
      </label>

      <select
        class="select"
        onchange="
          ${callback}(this.value)
        "
      >

        ${projectOptions(
          selected
        )}

      </select>

    </div>

  `;

}


/* =========================================================
   PROJECT CARD
   ========================================================= */

function projectCard(
  project
){

  const total =
    num(project.units);

  const booked =
    num(project.bookedUnits);

  const percentage =
    total
      ? Math.min(
          100,
          booked /
          total *
          100
        )
      : 0;

  return `

    <div
      class="project"
      onclick="
        openProject(
          '${esc(
            project.projectId ||
            project["Project ID"]
          )}'
        )
      "
    >

      <div class="eyebrow">

        ${esc(
          project.projectId ||
          project["Project ID"]
        )}

        ·

        ${esc(
          project.location ||
          project["Location"] ||
          ""
        )}

      </div>

      <div class="name">

        ${esc(
          project.projectName ||
          project["Project Name"]
        )}

      </div>

      <div class="sub">

        ${esc(
          project.status ||
          project["Project Status"] ||
          ""
        )}

        · Completion

        ${esc(
          project.expectedCompletion ||
          project["Expected Completion"] ||
          "—"
        )}

      </div>

      <div class="progress">

        <span
          style="
            width:${percentage}%
          "
        ></span>

      </div>

      <div class="project-stats">

        <div>

          <small>
            Units
          </small>

          <strong>
            ${total}
          </strong>

        </div>

        <div>

          <small>
            Booked
          </small>

          <strong>
            ${booked}
          </strong>

        </div>

        <div>

          <small>
            Leads
          </small>

          <strong>
            ${num(project.leads)}
          </strong>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   HOME
   ========================================================= */

async function home(){

  setActive("home");

  destroyChart();

  document.getElementById(
    "appRoot"
  ).innerHTML =
    `<div class="sub">
      Loading live dashboard…
    </div>`;

  try{

    const dashboard =
      await api(
        "dashboard"
      );

    cache.dashboard =
      dashboard;

    cache.projects =
      (
        dashboard.projects ||
        []
      );

    const inventory =
      dashboard.inventory;

    const k =
      dashboard.kpis;

    const f =
      dashboard.funnel;

    const fin =
      dashboard.finance;

    document.getElementById(
      "appRoot"
    ).innerHTML =

      head(
        "Company Dashboard",
        "Overall performance across Earthen Spaces.",
        `<button
          class="btn"
          onclick="home()"
        >
          ↻ Refresh
        </button>`
      )

      +

      `<div class="grid6">

        ${kpi(
          "Projects",
          k.totalProjects,
          "Portfolio"
        )}

        ${kpi(
          "Leads",
          k.totalLeads,
          "All sources"
        )}

        ${kpi(
          "Site Visits",
          k.totalSiteVisits,
          `${k.firstVisits} first · ${k.revisits} revisit`
        )}

        ${kpi(
          "Bookings",
          k.totalBookings,
          money(k.totalBookingValue)
        )}

        ${kpi(
          "Collections",
          money(k.totalCollections),
          "CRM collections"
        )}

        ${kpi(
          "Net Cash",
          money(k.netCashPosition),
          k.netCashPosition < 0
            ? "Current position"
            : "Positive position"
        )}

      </div>`

      +

      `<div class="section">

        <div class="section-head">

          <h2>
            Projects Overview
          </h2>

          <span class="sub">
            Click a project
          </span>

        </div>

        <div class="project-grid">

          ${cache.projects
            .map(projectCard)
            .join("")}

        </div>

      </div>`

      +

      `<div class="section grid2">

        <div class="card">

          <div class="section-head">

            <h2>
              Monthly Business Trend
            </h2>

            <span class="sub">
              Leads · Visits · Bookings
            </span>

          </div>

          <div class="chartbox">
            <canvas
              id="homeTrendChart">
            </canvas>
          </div>

        </div>

        <div class="card">

          <div class="section-head">

            <h2>
              Inventory
            </h2>

            <span class="sub">
              ${inventory.total} units
            </span>

          </div>

          <div class="chartbox">
            <canvas
              id="homeInventoryChart">
            </canvas>
          </div>

        </div>

      </div>`

      +

      `<div class="section grid2">

        <div class="card">

          <div class="section-head">

            <h2>
              Monthly Cash Flow
            </h2>

            <span class="sub">
              Inflow vs Outflow
            </span>

          </div>

          <div class="chartbox">

            <canvas
              id="homeCashChart">
            </canvas>

          </div>

        </div>

        <div class="card">

          <div class="section-head">

            <h2>
              Finance Snapshot
            </h2>

          </div>

          ${financeRow(
            "Collections",
            money(
              fin.collections
            )
          )}

          ${financeRow(
            "Project Payments",
            money(
              fin.projectPayments
            )
          )}

          ${financeRow(
            "Marketing Payments",
            money(
              fin.marketingPayments
            )
          )}

          ${financeRow(
            "Company Expenses",
            money(
              fin.companyExpenses
            )
          )}

          ${financeRow(
            "Total Expenses",
            money(
              fin.totalExpenses
            )
          )}

        </div>

      </div>`;


    /* HOME TREND */

    const monthly =
      dashboard.monthly ||
      {};

/* =========================================================
   MONTH LABEL
   ========================================================= */

function monthLabel(
  value
){

  if(!value)
    return "";

  if(
    !/^\d{4}-\d{2}$/
      .test(value)
  ){

    return value;

  }

  const [
    year,
    month
  ] =
    value.split("-");

  const names=[
    "Jan","Feb","Mar","Apr",
    "May","Jun","Jul","Aug",
    "Sep","Oct","Nov","Dec"
  ];

  return (
    names[
      Number(month)-1
    ] +
    "-" +
    year
  );

}

                ),

                money(
                  row["Amount"]
                ),

                esc(
                  row["Payment Mode"] ||
                  "—"
                ),

                badge(
                  row["Status"] ||
                  "—"
                )

              ]
            )

          )}

        </div>


        <div class="card">

          <div class="section-head">

            <h2>
              Bookings
            </h2>

          </div>

          ${table(

            [
              "Date",
              "Lead",
              "Project",
              "Unit",
              "Value"
            ],

            bookings.map(
              row => [

                esc(
                  row["Booking Date"] ||
                  "—"
                ),

                esc(
                  row["Lead ID"]
                ),

                esc(
                  row["Project Name"] ||
                  row["Project ID"]
                ),

                esc(
                  row["Unit ID"] ||
                  "—"
                ),

                money(
                  row["Booking Value"]
                )

              ]
            )

          )}

        </div>

      </div>`;

    activeChart =
      new Chart(

        document.getElementById(
          "crmChart"
        ),

        {

          type:"bar",

          data:{

            labels:
              (
                crmData.monthly ||
                []
              ).map(
                row =>
                  row.label
              ),

            datasets:[

              {
                label:"Target",

                data:
                  (
                    crmData.monthly ||
                    []
                  ).map(
                    row =>
                      row.target ||
                      0
                  )
              },

              {
                label:"Collections",

                data:
                  (
                    crmData.monthly ||
                    []
                  ).map(
                    row =>
                      row.collections ||
                      0
                  )
              }

            ]

          },

          options:{

            responsive:true,

            maintainAspectRatio:false,

            plugins:{
              legend:{
                position:"bottom"
              }
            }

          }

        }

      );

  }catch(error){

    showError(error);

  }

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
  error
){

  destroyChart();

  document.getElementById(
    "appRoot"
  ).innerHTML = `

    <div class="error">

      <b>
        Could not load this module.
      </b>

      <br><br>

      ${esc(
        error.message
      )}

    </div>

  `;

}


/* =========================================================
   NAVIGATION
   ========================================================= */

document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const page =
            button.dataset.page;

          if(page === "home")
            home();

          else if(
            page === "projects"
          )
            projects();

          else if(
            page === "approvals"
          )
            approvals();

          else if(
            page === "finance"
          )
            finance();

          else if(
            page === "marketing"
          )
            marketing();

          else if(
            page === "presales"
          )
            presales();

          else if(
            page === "sales"
          )
            sales();

          else if(
            page === "cp"
          )
            cp();

          else if(
            page === "crm"
          )
            crm();

        }
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

home();

</script>

</body>
</html>
