<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earthen Spaces — Management Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --ink:#17372f;
  --ink2:#2d604f;
  --green:#3f8067;
  --paper:#f5f3ec;
  --card:#ffffff;
  --line:#e1dfd6;
  --muted:#6d776f;
  --gold:#b48b4a;
  --red:#b7584c;
  --blue:#5e839d;
  --shadow:0 6px 22px rgba(23,55,47,.07);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,select,input{font:inherit}
button{cursor:pointer}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:250px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  background:var(--ink);
  color:#fff;
  padding:22px 15px;
  overflow:auto;
}

.brand{
  padding:5px 12px 22px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:14px;
}

.brand h1{
  font:500 27px Georgia,serif;
  line-height:.95;
  margin:0;
}

.brand small{
  display:block;
  margin-top:9px;
  letter-spacing:.13em;
  font-size:9px;
  opacity:.65;
}

.nav button{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:#dbe9e3;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  margin:2px 0;
}

.nav button.active,
.nav button:hover{
  background:#2b604f;
  color:#fff;
}

.content{
  margin-left:250px;
  width:calc(100% - 250px);
  padding:26px 30px 48px;
}

.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.page-title{
  font:500 34px Georgia,serif;
  margin:0 0 5px;
}

h2{
  font:600 19px Georgia,serif;
  margin:0;
}

h3{
  font:600 17px Georgia,serif;
  margin:0;
}

.sub{
  color:var(--muted);
}

.actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn,
.select,
.search{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  padding:9px 11px;
  border-radius:7px;
}

.btn.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
}

.status i{
  width:7px;
  height:7px;
  border-radius:50%;
  display:inline-block;
  background:var(--green);
}

.filterbar{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.filterbar label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
}

.grid-6{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:11px;
}

.grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
}

.grid-2{
  display:grid;
  grid-template-columns:1.25fr 1fr;
  gap:12px;
}

.kpi,
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px;
  box-shadow:var(--shadow);
}

.kpi label,
.metric label,
.info label{
  font-size:10px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
}

.kpi b{
  display:block;
  font:600 24px Georgia,serif;
  margin-top:8px;
}

.kpi small{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:11px;
}

.section{
  margin-top:18px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.project-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
}

.project{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:17px;
  cursor:pointer;
}

.project:hover{
  box-shadow:var(--shadow);
  transform:translateY(-1px);
}

.project .eyebrow{
  font-size:11px;
  color:var(--muted);
}

.project .name{
  font:600 21px Georgia,serif;
  margin:6px 0 3px;
}

.progress{
  height:7px;
  background:#ebebe5;
  border-radius:15px;
  overflow:hidden;
  margin:13px 0;
}

.progress span{
  height:100%;
  display:block;
  background:var(--green);
}

.project-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.project-stats small{
  color:var(--muted);
  font-size:10px;
}

.project-stats strong{
  display:block;
  margin-top:2px;
}

.chartbox{
  height:285px;
}

.funnel{
  height:255px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:18px;
  padding:15px;
}

.fstep{
  text-align:center;
  min-width:75px;
}

.fbar{
  width:72px;
  margin:0 auto 7px;
  background:var(--green);
  border-radius:5px 5px 2px 2px;
  opacity:.75;
}

.fstep b{
  display:block;
  font:600 21px Georgia,serif;
}

.fstep small{
  color:var(--muted);
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #eeeae1;
  font-size:12px;
}

.row:last-child{
  border-bottom:0;
}

.badge{
  font-size:10px;
  padding:4px 8px;
  border-radius:20px;
  white-space:nowrap;
}

.badge.good{
  background:#e8f2ec;
  color:#2e705a;
}

.badge.warn{
  background:#faf0dd;
  color:#906924;
}

.badge.bad{
  background:#f9e8e5;
  color:#a64f45;
}

.badge.info{
  background:#eaf0f4;
  color:#4e7087;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,
td{
  padding:9px 7px;
  border-bottom:1px solid #eeeae1;
  text-align:left;
  white-space:nowrap;
}

th{
  font-size:10px;
  text-transform:uppercase;
  color:var(--muted);
  letter-spacing:.05em;
}

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:12px 0 14px;
}

.tab{
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:9px 12px;
  color:var(--muted);
}

.tab.active{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

.info{
  background:#fff;
  border:1px solid var(--line);
  border-radius:9px;
  padding:14px;
}

.info b{
  display:block;
  font:600 19px Georgia,serif;
  margin-top:6px;
}

.notice{
  background:#f2efe6;
  border:1px dashed #d8d0c1;
  border-radius:9px;
  padding:13px;
  color:var(--muted);
}

.error{
  background:#faebe8;
  border:1px solid #e5c4be;
  border-radius:9px;
  padding:13px;
  color:#9b463d;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:1200px){
  .grid-6{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .project-grid{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
}

@media(max-width:760px){
  .sidebar{
    position:static;
    width:100%;
    height:auto;
  }

  .app{display:block}

  .content{
    margin-left:0;
    width:100%;
    padding:20px 14px;
  }

  .nav{
    display:flex;
    overflow:auto;
  }

  .nav button{
    min-width:max-content;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .grid-6{
    grid-template-columns:1fr 1fr;
  }

  .grid-3{
    grid-template-columns:1fr;
  }

  .grid-4{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <h1>EARTHEN<br>SPACES</h1>
      <small>BUILDING BETTER TOMORROWS</small>
    </div>

    <nav class="nav">
      <button data-page="home" class="active">⌂ &nbsp; Home</button>
      <button data-page="projects">▦ &nbsp; Projects</button>
      <button data-page="approvals">✓ &nbsp; Approvals</button>
      <button data-page="finance">₹ &nbsp; Finance</button>
      <button data-page="marketing">◈ &nbsp; Marketing</button>
      <button data-page="presales">☎ &nbsp; Pre-Sales</button>
      <button data-page="sales">▤ &nbsp; Sales</button>
      <button data-page="cp">♧ &nbsp; Channel Partners</button>
      <button data-page="crm">◎ &nbsp; CRM & Collections</button>
    </nav>

  </aside>

  <main class="content">
    <div id="appRoot">
      <div class="sub">Loading dashboard…</div>
    </div>
  </main>

</div>

<script>

/* ==================================================
   API
   ================================================== */

const API =
"https://script.google.com/macros/s/AKfycbziG51HnCv6QSyq7EGmLQfOc4_zBLPMEAO10x0OwLnNtLroqbALgJDhvsCo2dpSda1pyw/exec";


/* ==================================================
   STATE
   ================================================== */

let cache = {
  dashboard:null,
  inventory:null,
  approvals:null,
  projects:null,
  leads:null,
  visits:null,
  bookings:null,
  finance:null,
  project:null
};

let activeChart = null;


/* ==================================================
   HELPERS
   ================================================== */

const esc = value =>
  String(value ?? "")
    .replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char]));

const num = value =>
  Number(value || 0);


function money(value){

  const n = num(value);
  const a = Math.abs(n);

  if(a >= 10000000)
    return "₹" + (n / 10000000).toFixed(2) + " Cr";

  if(a >= 100000)
    return "₹" + (n / 100000).toFixed(1) + " L";

  return "₹" + Math.round(n).toLocaleString("en-IN");
}


function badge(status){

  const x =
    String(status || "").toLowerCase();

  let cls = "info";

  if(
    x.includes("pending") ||
    x.includes("planned") ||
    x.includes("hold")
  )
    cls = "warn";

  if(
    x.includes("completed") ||
    x.includes("done") ||
    x.includes("paid") ||
    x.includes("active") ||
    x.includes("ongoing")
  )
    cls = "good";

  if(
    x.includes("delay") ||
    x.includes("cancel") ||
    x.includes("blocked")
  )
    cls = "bad";

  return `
    <span class="badge ${cls}">
      ${esc(status || "—")}
    </span>
  `;
}


async function api(action, params = {}){

  const query =
    new URLSearchParams({
      action,
      ...params,
      _:Date.now()
    });

  const response =
    await fetch(API + "?" + query.toString());

  if(!response.ok)
    throw new Error("API request failed (" + response.status + ")");

  const result =
    await response.json();

  if(result.success === false)
    throw new Error(result.error || "API error");

  return result;
}


function setActive(page){

  document
    .querySelectorAll(".nav button")
    .forEach(button =>
      button.classList.toggle(
        "active",
        button.dataset.page === page
      )
    );
}


function destroyChart(){

  if(activeChart){

    activeChart.destroy();

    activeChart = null;
  }
}


function head(title, subtitle, extra = ""){

  return `
    <div class="topbar">

      <div>
        <h1 class="page-title">${esc(title)}</h1>
        <div class="sub">${esc(subtitle)}</div>
      </div>

      <div class="actions">

        ${extra}

        <span class="status">
          <i></i>
          Live
        </span>

      </div>

    </div>
  `;
}


function kpi(label,value,note){

  return `
    <div class="kpi">

      <label>${esc(label)}</label>

      <b>${value}</b>

      <small>${esc(note)}</small>

    </div>
  `;
}


function projectCard(project){

  const total =
    num(project.units);

  const booked =
    num(project.bookedUnits);

  const percentage =
    total
      ? Math.min(100, booked / total * 100)
      : 0;

  return `
    <div
      class="project"
      onclick="openProject('${esc(project.projectId)}')"
    >

      <div class="eyebrow">
        ${esc(project.projectId)}
        ·
        ${esc(project.location || "")}
      </div>

      <div class="name">
        ${esc(project.projectName)}
      </div>

      <div class="sub">
        ${esc(project.status || "")}
        · Completion
        ${esc(project.expectedCompletion || "—")}
      </div>

      <div class="progress">
        <span style="width:${percentage}%"></span>
      </div>

      <div class="project-stats">

        <div>
          <small>Units</small>
          <strong>${total}</strong>
        </div>

        <div>
          <small>Booked</small>
          <strong>${booked}</strong>
        </div>

        <div>
          <small>Leads</small>
          <strong>${num(project.leads)}</strong>
        </div>

      </div>

    </div>
  `;
}


function table(headers,rows){

  if(!rows.length)
    return `<div class="empty">No records found.</div>`;

  return `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            ${headers
              .map(header => `<th>${esc(header)}</th>`)
              .join("")}
          </tr>
        </thead>

        <tbody>

          ${rows
            .map(row => `
              <tr>
                ${row
                  .map(value => `<td>${value}</td>`)
                  .join("")}
              </tr>
            `)
            .join("")}

        </tbody>

      </table>

    </div>
  `;
}


function projectOptions(selected = "ALL"){

  const list =
    cache.projects || [];

  return `
    <option value="ALL"
      ${selected === "ALL" ? "selected" : ""}>
      All Projects
    </option>

    ${list
      .map(project => `
        <option
          value="${esc(project.projectId)}"
          ${selected === project.projectId ? "selected" : ""}
        >
          ${esc(project.projectName)}
        </option>
      `)
      .join("")}
  `;
}


function projectFilter(current, callback){

  return `
    <div class="filterbar">

      <label>Project</label>

      <select
        class="select"
        id="projectFilter"
        onchange="${callback}(this.value)"
      >

        ${projectOptions(current)}

      </select>

    </div>
  `;
}


/* ==================================================
   HOME
   ================================================== */

async function home(){

  setActive("home");
  destroyChart();

  document.getElementById("appRoot").innerHTML =
    '<div class="sub">Loading live dashboard…</div>';

  try{

    const [
      dashboard,
      inventory,
      approvals
    ] =
    await Promise.all([
      api("dashboard"),
      api("inventory"),
      api("approvals")
    ]);

    cache.dashboard = dashboard;
    cache.inventory = inventory;
    cache.approvals = approvals.data || [];
    cache.projects = dashboard.projects || [];

    const k =
      dashboard.kpis;

    const f =
      dashboard.funnel;

    const fin =
      dashboard.finance;

    document.getElementById("appRoot").innerHTML =

      head(
        "Company Dashboard",
        "Overall performance across Earthen Spaces.",
        `<button class="btn" onclick="home()">↻ Refresh</button>`
      )

      +

      `<div class="grid-6">

        ${kpi(
          "Projects",
          k.totalProjects,
          "Active portfolio"
        )}

        ${kpi(
          "Leads",
          k.totalLeads,
          "All sources"
        )}

        ${kpi(
          "Site Visits",
          k.totalSiteVisits,
          `${k.firstVisits} first · ${k.revisits} revisit`
        )}

        ${kpi(
          "Bookings",
          k.totalBookings,
          money(k.totalBookingValue)
        )}

        ${kpi(
          "Collections",
          money(k.totalCollections),
          "CRM collections"
        )}

        ${kpi(
          "Net Cash",
          money(k.netCashPosition),
          k.netCashPosition < 0
            ? "Current position"
            : "Positive position"
        )}

      </div>`

      +

      `<div class="section">

        <div class="section-head">

          <h2>Projects Overview</h2>

          <span class="sub">
            Click a project for details
          </span>

        </div>

        <div class="project-grid">

          ${cache.projects
            .map(projectCard)
            .join("")}

        </div>

      </div>`

      +

      `<div class="section grid-2">

        <div class="card">

          <div class="section-head">
            <h2>Lead Funnel</h2>
            <span class="sub">Company total</span>
          </div>

          <div class="funnel">

            ${funnelStep("Leads",f.leads,100)}

            ${funnelStep(
              "Site Visits",
              f.siteVisits,
              f.leads
                ? f.siteVisits / f.leads * 100
                : 12
            )}

            ${funnelStep(
              "Bookings",
              f.bookings,
              f.leads
                ? f.bookings / f.leads * 100
                : 12
            )}

            ${funnelStep(
              "Collections",
              f.collections,
              f.leads
                ? f.collections / f.leads * 100
                : 12
            )}

          </div>

        </div>

        <div class="card">

          <div class="section-head">

            <h2>Inventory</h2>

            <span class="sub">
              ${inventory.summary.total} units
            </span>

          </div>

          <div class="chartbox">
            <canvas id="inventoryChart"></canvas>
          </div>

        </div>

      </div>`

      +

      `<div class="section grid-3">

        <div class="card">

          <div class="section-head">
            <h2>Finance</h2>
          </div>

          ${financeRow(
            "Collections",
            money(fin.collections)
          )}

          ${financeRow(
            "Project Payments",
            money(fin.projectPayments)
          )}

          ${financeRow(
            "Marketing Payments",
            money(fin.marketingPayments)
          )}

          ${financeRow(
            "Company Expenses",
            money(fin.companyExpenses)
          )}

          ${financeRow(
            "Total Expenses",
            money(fin.totalExpenses)
          )}

        </div>

        <div class="card">

          <div class="section-head">

            <h2>Approvals</h2>

            <span class="sub">
              ${dashboard.approvals.pending} pending
            </span>

          </div>

          ${cache.approvals
            .slice(0,6)
            .map(row => `
              <div class="row">

                <span>
                  ${esc(
                    row["Project Name"] ||
                    row["Project ID"] ||
                    "—"
                  )}

                  <br>

                  <small class="sub">
                    ${esc(
                      row["Approval Type"] ||
                      "—"
                    )}
                  </small>

                </span>

                ${badge(row.Status)}

              </div>
            `)
            .join("")}

        </div>

        <div class="card">

          <div class="section-head">
            <h2>Quick View</h2>
          </div>

          ${financeRow(
            "Booked Units",
            inventory.summary.booked
          )}

          ${financeRow(
            "Available Units",
            inventory.summary.available
          )}

          ${financeRow(
            "Hold Units",
            inventory.summary.hold
          )}

          ${financeRow(
            "Pending Approvals",
            dashboard.approvals.pending
          )}

          ${financeRow(
            "Company Expenses",
            money(fin.companyExpenses)
          )}

        </div>

      </div>`;

    const canvas =
      document.getElementById("inventoryChart");

    activeChart =
      new Chart(
        canvas,
        {
          type:"doughnut",

          data:{
            labels:[
              "Booked",
              "Available",
              "Hold",
              "Blocked"
            ],

            datasets:[
              {
                data:[
                  inventory.summary.booked,
                  inventory.summary.available,
                  inventory.summary.hold,
                  inventory.summary.blocked
                ]
              }
            ]
          },

          options:{
            responsive:true,
            maintainAspectRatio:false,
            cutout:"68%",

            plugins:{
              legend:{
                position:"bottom"
              }
            }
          }
        }
      );

  }catch(error){

    showError(error);

  }

}


function funnelStep(label,value,width){

  return `
    <div class="fstep">

      <div
        class="fbar"
        style="height:${Math.max(
          24,
          width * 1.35
        )}px"
      ></div>

      <b>${num(value)}</b>

      <small>${esc(label)}</small>

    </div>
  `;
}


function financeRow(label,value){

  return `
    <div class="row">
      <span>${esc(label)}</span>
      <b>${value}</b>
    </div>
  `;
}


/* ==================================================
   PROJECTS
   ================================================== */

async function projects(){

  setActive("projects");
  destroyChart();

  document.getElementById("appRoot").innerHTML =
    '<div class="sub">Loading projects…</div>';

  try{

    const result =
      await api("projectList");

    cache.projects =
      result.data || [];

    document.getElementById("appRoot").innerHTML =

      head(
        "Projects",
        "Project-wise performance, execution and commercial overview.",
        `<button class="btn" onclick="projects()">↻ Refresh</button>`
      )

      +

      `<div class="project-grid">

        ${cache.projects
          .map(projectCard)

async function approvals(projectId="ALL"){

  setActive("approvals");
  destroyChart();

  try{

    if(!cache.approvals){

      const result =
        await api("approvals");

      cache.approvals =
        result.data || [];
    }

    if(!cache.projects){

      const result =
        await api("projectList");

      cache.projects =
        result.data || [];
    }

    let records =
      [...cache.approvals];

    if(projectId !== "ALL"){

      records =
        records.filter(row =>
          String(
            row["Project ID"]
          ) === String(projectId)
        );

    }

    const pending =
      records.filter(row =>
        String(row.Status)
          .toLowerCase() === "pending"
      ).length;

    const completed =
      records.filter(row =>
        ["completed","done"]
          .includes(
            String(row.Status)
              .toLowerCase()
          )
      ).length;

    const selectedProject =
      projectId === "ALL"
        ? "All Projects"
        : (
            cache.projects.find(
              p => p.projectId === projectId
            )?.projectName ||
            projectId
          );

    document.getElementById("appRoot").innerHTML =

      head(
        "Approvals",
        "Track RERA, DTCP, Local Body and other approvals.",
        `<button class="btn" onclick="approvals('${projectId}')">
          ↻ Refresh
        </button>`
      )

      +

      projectFilter(
        projectId,
        "approvals"
      )

      +

      `<div class="grid-4">

        ${kpi(
          "Total",
          records.length,
          selectedProject
        )}

        ${kpi(
          "Pending",
          pending,
          "Need action"
        )}

        ${kpi(
          "Completed",
          completed,
          "Done"
        )}

        ${kpi(
          "Other",
          Math.max(
            0,
            records.length -
            pending -
            completed
          ),
          "Other status"
        )}

      </div>`

      +

      `<div class="section">

        <div class="card">

          ${table(
            [
              "Project",
              "Approval",
              "Authority",
              "Status",
              "Target Date",
              "Completion Date"
            ],

            records.map(row => [

              esc(
                row["Project Name"] ||
                row["Project ID"] ||
                "—"
              ),

              esc(
                row["Approval Type"] ||
                "—"

              esc(
                row["Authority"] ||
                "—"
              ),

              esc(
                row["Target Date"] ||
                "—"
              ),

              esc(
                row["Completion Date"] ||
                "—"

  }catch(error){

    showError(error);

async function marketing(projectId="ALL"){

  setActive("marketing");
  destroyChart();

  try{

    const [
      leadsResult,
      visitsResult,
      projectListResult
    ] =
    await Promise.all([
      api("leads"),
      api("siteVisits"),
      cache.projects
        ? Promise.resolve({
            data:cache.projects
          })
        : api("projectList")
    ]);

    cache.projects =
      projectListResult.data || [];

    cache.leads =
      leadsResult.data || [];

    cache.visits =
      visitsResult.data || [];

    let leads =
      [...cache.leads];

    let visits =
      [...cache.visits];

    if(projectId !== "ALL"){

      leads =
        leads.filter(row =>
          String(row["Project ID"]) ===
          String(projectId)
        );

      visits =
        visits.filter(row =>
          String(row["Project ID"]) ===
          String(projectId)
        );

    }

    const sources = {};

    leads.forEach(row => {

      const source =
        row["Source"] ||
        row["Lead Source"] ||
        "Unknown";

      sources[source] =
        (sources[source] || 0) + 1;

    });

    const sourceRows =
      Object.entries(sources)
        .sort((a,b) => b[1] - a[1])
        .map(([source,count]) => [
          esc(source),
          count
        ]);

    const firstVisits =
      visits.filter(row =>
        String(row["Visit Type"])
          .toLowerCase() === "first visit"
      ).length;

    const revisits =
      visits.filter(row =>
        String(row["Visit Type"])
          .toLowerCase() === "revisit"
      ).length;

    const selectedProject =
      projectId === "ALL"
        ? "All Projects"
        : (
            cache.projects.find(
              p => p.projectId === projectId
            )?.projectName ||
            projectId
          );

    document.getElementById("appRoot").innerHTML =

      head(
        "Marketing",
        "Lead source and site-visit performance.",
        `<button
          class="btn"
          onclick="marketing('${projectId}')"
        >
          ↻ Refresh
        </button>`
      )

      +

      projectFilter(
        projectId,
        "marketing"
      )

      +

      `<div class="grid-4">

        ${kpi(
          "Leads",
          leads.length,
          selectedProject
        )}

        ${kpi(
          "Site Visits",
          visits.length,
          "Total visits"
        )}

        ${kpi(
          "First Visits",
          firstVisits,
          "New prospects"
        )}

        ${kpi(
          "Revisits",
          revisits,
          "Repeat visits"
        )}

      </div>

      <div class="section grid-2">

        <div class="card">

          <div class="section-head">
            <h2>Lead Sources</h2>

          ${table(
            [
              "Source",

            ],

          String(projectId)
        );

      bookings =
        bookings.filter(row =>
          String(row["Project ID"]) ===
          String(projectId)
        );

    }

    const activeBookings =
      bookings.filter(row =>
        String(row["Status"])
          .toLowerCase() !== "cancelled"
      );

    const bookingValue =
      activeBookings.reduce(
        (sum,row) =>
          sum + num(row["Booking Value"]),
        0
      );

    const selectedProject =
      projectId === "ALL"
        ? "All Projects"
        : (
            cache.projects.find(
              p => p.projectId === projectId
            )?.projectName ||
            projectId
          );

    const booked =
      inventory.filter(row =>
        String(row["Availability Status"])
          .toLowerCase() === "booked"
      ).length;

    const available =
      inventory.filter(row =>
        String(row["Availability Status"])
          .toLowerCase() === "available"
      ).length;

    const hold =
      inventory.filter(row =>
        String(row["Availability Status"])
          .toLowerCase() === "hold"
      ).length;

    document.getElementById("appRoot").innerHTML =

      head(
        "Sales",
        "Inventory and booking performance.",
        `<button
          class="btn"
          onclick="sales('${projectId}')"
        >
          ↻ Refresh
        </button>`
      )

      +

      projectFilter(
        projectId,
        "sales"
      )

      +

      `<div class="grid-4">

        ${kpi(
          "Units",
          inventory.length,
          selectedProject
        )}

        ${kpi(
          "Booked",
          booked,
          "Units booked"
        )}

        ${kpi(
          "Available",
          available,
          "Open inventory"
        )}

        ${kpi(
          "Booking Value",
          money(bookingValue),
          `${activeBookings.length} active bookings`
        )}

      </div>

      <div class="section grid-2">

        <div class="card">

          <div class="section-head">
            <h2>Inventory</h2>
          </div>

          ${table(
            [
              "Unit",
              "Project",
              "Type",
              "Status",
              "Customer",
              "Lead"
            ],

            inventory.map(row => [

              esc(
                row["Unit ID"]
              ),

              esc(
                row["Project Name"] ||
                row["Project ID"]
              ),

              esc(
                row["Unit Type"]
              ),

              badge(
                row["Availability Status"]
              ),

              esc(
                row["Customer"] ||
                "—"
              ),

              esc(
                row["Lead ID"] ||
                "—"
              )

            ])
          )}

        </div>

        <div class="card">

          <div class="section-head">
            <h2>Bookings</h2>
          </div>

          ${table(
            [
              "Date",
              "Lead",
              "Project",
              "Unit",
              "Value",
              "Status"
            ],

            bookings.map(row => [

              esc(
                row["Booking Date"] ||
                row["Date"] ||
                "—"
              ),

              esc(row["Lead ID"]),

              esc(
                row["Project Name"] ||
                row["Project ID"]
              ),

              esc(
                row["Unit ID"] ||
                "—"
              ),

              money(
                row["Booking Value"]
              ),

              badge(
                row["Status"]
              )

            ])
          )}

        </div>

      </div>`;

  }catch(error){

    showError(error);

  }

}


/* ==================================================
   CHANNEL PARTNERS
   ================================================== */

async function cp(){

  setActive("cp");
  destroyChart();

  try{

    const result =
      await api("leads");

    const leads =
      result.data || [];

    const partnerMap = {};

    leads.forEach(row => {

      const source =
        row["CP"] ||
        row["Channel Partner"] ||
        "Unknown";

      partnerMap[source] =
        (partnerMap[source] || 0) + 1;

    });

    const rows =
      Object.entries(partnerMap)
        .sort((a,b) => b[1] - a[1])
        .map(([name,count]) => [
          esc(name),
          count
        ]);

    document.getElementById("appRoot").innerHTML =

      head(
        "Channel Partners",
        "Partner contribution from the common lead funnel."
      )

      +

      `<div class="grid-4">

        ${kpi(
          "Lead Records",
          leads.length,
          "Available lead records"
        )}

        ${kpi(
          "Partner / Source Values",
          rows.length,
          "Distinct values"
        )}

        ${kpi(
          "CP Payout",
          "—",
          "API endpoint pending"
        )}

        ${kpi(
          "CP Contribution",
          "—",
          "Detailed endpoint pending"
        )}

      </div>

      <div class="section grid-2">

        <div class="card">

          <div class="section-head">
            <h2>Partner Contribution</h2>
          </div>

          ${table(
            [
              "Partner / Source",
              "Leads"
            ],
            rows
          )}

        </div>

        <div class="card">

          <div class="section-head">
            <h2>CP Payout</h2>
          </div>

          <div class="notice">

            CP master, payout and detailed contribution
            tables are present in the database.

            Their dedicated API endpoints can be added
            later.

          </div>

        </div>

      </div>`;

  }catch(error){

    showError(error);

  }

}


/* ==================================================
   CRM & COLLECTIONS
   PROJECT FILTER
   ================================================== */

async function crm(projectId="ALL"){

  setActive("crm");
  destroyChart();

  try{

    if(!cache.dashboard){

      cache.dashboard =
        await api("dashboard");
    }

    if(!cache.projects){

      const projectList =
        await api("projectList");

      cache.projects =
        projectList.data || [];
    }

    let projectRows =
      [...(cache.dashboard.projects || [])];

    let bookings = [];

    let bookingValue = 0;

    let collections = 0;

    if(projectId === "ALL"){

      const bookingResult =
        await api("bookings");

      bookings =
        bookingResult.data || [];

      bookingValue =
        bookingResult.totalBookingValue;

      collections =
        cache.dashboard.kpis.totalCollections;

    }else{

      const projectData =
        await api(
          "project",
          {id:projectId}
        );

      bookings =
        projectData.bookings || [];

      bookingValue =
        projectData.summary.bookingValue;

      collections =
        projectRows
          .find(row =>
            row.projectId === projectId
          )?.collections || 0;

      projectRows =
        projectRows.filter(row =>
          row.projectId === projectId
        );

    }

    const activeBookings =
      bookings.filter(row =>
        String(row["Status"])
          .toLowerCase() !== "cancelled"
      );

    const selectedProject =
      projectId === "ALL"
        ? "All Projects"
        : (
            cache.projects.find(
              p => p.projectId === projectId
            )?.projectName ||
            projectId
          );

    document.getElementById("appRoot").innerHTML =

      head(
        "CRM & Collections",
        "Bookings, collections and project-linked customer funnel.",
        `<button
          class="btn"
          onclick="crm('${projectId}')"
        >
          ↻ Refresh
        </button>`
      )

      +

      projectFilter(
        projectId,
        "crm"
      )

      +

      `<div class="grid-4">

        ${kpi(
          "Bookings",
          activeBookings.length,
          selectedProject
        )}

        ${kpi(
          "Booking Value",
          money(bookingValue),
          "Active booking value"
        )}

        ${kpi(
          "Collections",
          money(collections),
          "Collections"
        )}

        ${kpi(
          "Project Count",
          projectRows.length,
          selectedProject
        )}

      </div>

      <div class="section grid-2">

        <div class="card">

          <div class="section-head">
            <h2>Project Collections</h2>
          </div>

          ${table(
            [
              "Project",
              "Bookings",
              "Booking Value",
              "Collections"
            ],

            projectRows.map(row => [

              esc(row.projectName),

              num(row.bookings),

              money(row.bookingValue),

              money(row.collections)

            ])
          )}

        </div>

        <div class="card">

          <div class="section-head">
            <h2>Collection Target</h2>
          </div>

          <div class="notice">

            CRM Targets and collection target-date logic
            are present in the database.

            The current API exposes collection totals,
            while detailed target rows can be connected
            through the next CRM API endpoint.

          </div>

        </div>

      </div>

      <div class="section">

        <div class="card">

          <div class="section-head">

            <h2>Bookings</h2>

            <span class="sub">
              ${activeBookings.length}
            </span>

          </div>

          ${table(
            [
              "Date",
              "Lead",
              "Project",
              "Unit",
              "Value",
              "Status"
            ],

            bookings.map(row => [

              esc(
                row["Booking Date"] ||
                row["Date"] ||
                "—"
              ),

              esc(
                row["Lead ID"]
              ),

              esc(
                row["Project Name"] ||
                row["Project ID"]
              ),

              esc(
                row["Unit ID"] ||
                "—"
              ),

              money(
                row["Booking Value"]
              ),

              badge(
                row["Status"]
              )

            ])
          )}

        </div>

      </div>`;

  }catch(error){

    showError(error);

  }

}


/* ==================================================
   ERROR
   ================================================== */

function showError(error){

  destroyChart();

  document.getElementById("appRoot").innerHTML = `

    <div class="error">

      <b>Could not load this module.</b>

      <br><br>

      ${esc(error.message)}

    </div>

  `;

}

document
  .querySelectorAll(".nav button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const page =
          button.dataset.page;

        if(page === "home")
          home();

        else if(page === "projects")
          projects();

        else if(page === "approvals")
          approvals();

        else if(page === "finance")
          finance();

        else if(page === "marketing")
          marketing();

        else if(page === "presales")
          presales();

        else if(page === "sales")
          sales();

        else if(page === "cp")
          cp();

        else if(page === "crm")
          crm();

      }
    );

  });

home();
